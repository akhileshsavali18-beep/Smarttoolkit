name: APS TOOLS - Signed Release AAB + APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Verify Android project source
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Building directly from repository source (no ZIP extraction)."

      - name: Apply APS TOOLS ic_launcher logo everywhere
        run: |
          # Use the repository root ic_launcher.png as the single APS TOOLS logo asset.
          test -f ic_launcher.png
          mkdir -p app/src/main/res/drawable
          rm -f app/src/main/res/drawable/ic_launcher.xml
          cp -f ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          echo "Applied repository ic_launcher.png as the APS TOOLS logo."

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.APS_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build signed release AAB and APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.APS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon bundleRelease assembleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: APS-TOOLS-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: APS-TOOLS-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION_NAME}"
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$VERSION_NAME"
          test -n "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its APK with this build."
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "APS TOOLS $VERSION_NAME" --generate-notes
          fi
          echo "Published APK for $TAG"
