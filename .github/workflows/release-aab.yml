name: APS TOOLS - Signed Release AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Extract Android project
        run: |
          rm -rf /tmp/aps-project
          mkdir -p /tmp/aps-project
          unzip -q APStool.zip -d /tmp/aps-project

          PROJECT_ROOT=$(find /tmp/aps-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ] || { [ ! -f "$PROJECT_ROOT/app/build.gradle" ] && [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; }; then
            echo "ERROR: Android Gradle project root was not found inside APStool.zip"
            find /tmp/aps-project -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "Android project root: $PROJECT_ROOT"
          cp -a "$PROJECT_ROOT"/. .
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.APS_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.APS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: APS-TOOLS-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
