name: Razorpay Android SDK Compatibility

on:
  push:
    branches:
      - feature/firebase-email-auth
    paths:
      - ".github/workflows/razorpay-android-compatibility.yml"
      - ".github/scripts/razorpay-compat.init.gradle"
      - "app/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/firebase-email-auth

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app with Razorpay SDK injected for this test only
        run: ./gradlew --no-daemon -I .github/scripts/razorpay-compat.init.gradle :app:assembleDebug
