name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project, Clean Duplicates & Setup Keystore
        run: |
          # 1. Extract zip file
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          # 2. Fix Duplicate Resources (Delete old webp and xml duplicates)
          echo "Cleaning up duplicate icons and vector files..."
          find app/src/main/res/ -name "ic_launcher*.webp" -delete || true
          find app/src/main/res/ -name "ic_launcher*.xml" -delete || true
          find app/src/main/res/ -name "app_banner*.xml" -delete || true
          rm -rf app/src/main/res/mipmap-anydpi-v26 || true

          # 3. Setup app_banner.png
          if [ -f "app_banner.png" ]; then
            echo "Applying app_banner.png..."
            mkdir -p app/src/main/res/drawable
            cp -f app_banner.png app/src/main/res/drawable/app_banner.png
          fi

          # 4. Setup ic_launcher.png across mipmap folders
          if [ -f "ic_launcher.png" ]; then
            echo "Applying ic_launcher.png..."
            for dir in app/src/main/res/mipmap-*; do
              cp -f ic_launcher.png "$dir/ic_launcher.png"
              cp -f ic_launcher.png "$dir/ic_launcher_round.png"
            done
            mkdir -p app/src/main/res/drawable
            cp -f ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          fi

          # 5. Generate missing gradlew script
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

          # 6. Generate debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore || true

      - name: Build Android APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APSTools-Final-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
