name: Build Play Store Bundle & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project, Setup Assets & Keystore
        run: |
          # 1. Extract zip file
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          # 2. Setup Firebase google-services.json
          if [ -f "google-services.json" ]; then
            echo "Placing google-services.json into app directory..."
            cp -f google-services.json app/google-services.json
          fi

          # 3. Clean duplicate webp and vector icons
          echo "Cleaning duplicate files..."
          find app/src/main/res/ -name "ic_launcher*.webp" -delete || true
          find app/src/main/res/ -name "ic_launcher*.xml" -delete || true
          find app/src/main/res/ -name "app_banner*.xml" -delete || true
          rm -rf app/src/main/res/mipmap-anydpi-v26 || true

          # 4. Setup app_banner.png
          if [ -f "app_banner.png" ]; then
            echo "Applying app_banner.png..."
            mkdir -p app/src/main/res/drawable
            cp -f app_banner.png app/src/main/res/drawable/app_banner.png
          fi

          # 5. Setup ic_launcher.png across mipmap folders
          if [ -f "ic_launcher.png" ]; then
            echo "Applying ic_launcher.png..."
            for dir in app/src/main/res/mipmap-*; do
              cp -f ic_launcher.png "$dir/ic_launcher.png"
              cp -f ic_launcher.png "$dir/ic_launcher_round.png"
            done
            mkdir -p app/src/main/res/drawable
            cp -f ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          fi

          # 6. Generate missing gradlew script
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

          # 7. Create Permanent Production Release Keystore (Akhilesh Systems)
          keytool -genkey -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "apslabs123" \
            -keypass "apslabs123" \
            -dname "CN=Akhilesh Systems, OU=Mobile Development, O=Akhilesh Systems, L=Ainapur, ST=Karnataka, C=IN"

          cp my-upload-key.jks app/my-upload-key.jks

      - name: Build Signed Release Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: "apslabs123"
          KEY_PASSWORD: "apslabs123"
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Build Signed Release APK & Rename to app-release.apk
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: "apslabs123"
          KEY_PASSWORD: "apslabs123"
        run: |
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          
          # Output folder create maadi APK annu strictly app-release.apk anta rename maaduvudu
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE, renaming to app-release.apk..."
            cp -f "$APK_FILE" release-output/app-release.apk
          fi

      - name: Upload Play Store Bundle (.aab) & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: APSTools-PlayStore-Release
          path: |
            **/build/outputs/bundle/release/*.aab
            my-upload-key.jks

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: release-output/app-release.apk
          
