name: Payment Worker Checks

on:
  push:
    branches:
      - feature/firebase-email-auth
    paths:
      - "workers/aps-tools-payment/**"
      - ".github/workflows/payment-worker-checks.yml"
  pull_request:
    branches:
      - feature/firebase-email-auth
    paths:
      - "workers/aps-tools-payment/**"
      - ".github/workflows/payment-worker-checks.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/aps-tools-payment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
